[package]
name = "lwwo"
description = "Lightweight Workflow Orchestrator: master, worker, CLI and TUI in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lwwo-core.workspace = true
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = "0.3"
jiff = "0.2"
minijinja = "2"
pem = "3"
prost = "0.14"
ratatui = "0.30"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process", "system", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = "0.9"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
x509-parser = "0.18"
notify = "8.2.1"

[build-dependencies]
tonic-prost-build = "0.14"
