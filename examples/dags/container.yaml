# Tasks in containers. Needs a worker with `executors = ["process", "docker"]`
# (or "podman"), and a data directory Docker can mount.
name: in_containers
defaults:
  image: busybox:stable
tasks:
  hello:
    run: ["sh", "-c", "echo hello from $(hostname), run {{ run.id }}; ls -la $LWWO_WORKDIR"]
  from_git:
    needs: [hello]
    source:
      git: https://github.com/octocat/Hello-World.git
      ref: master
    run: ["cat", "README"]
